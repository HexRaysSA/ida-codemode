[project]
name = "ida-codemode-mcp"
version = "0.1.0"
description = "Code Mode MCP server for the ida-domain API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ida-domain>=0.4.0",
    "zeromcp>=1.5.0",
]

[project.scripts]
ida-codemode-mcp = "ida_codemode_mcp:cli"
ida-codemode-dashboard = "ida_codemode_dashboard:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ida_codemode_mcp.py", "ida_codemode_dashboard.py"]

[tool.uv.sources]
ida-domain = { git = "https://github.com/HexRaysSA/ida-domain", branch = "include-docs-examples" }
