[project]
name = "ida-codemode"
version = "0.6.0"
description = "Code Mode MCP server for the ida-domain API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ida-domain>=0.5.1",
    "zeromcp>=1.8.0",
    "packaging",
]

[project.scripts]
ida-codemode = "ida_codemode.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "ida-plugin.json",
    "ida_codemode_plugin.py",
    "ida_codemode",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# IDAPython modules provide type information but are importable only inside IDA.
reportMissingModuleSource = "none"
