[project]
name = "ida-codemode"
version = "0.4.1"
description = "Code Mode MCP server for the ida-domain API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ida-domain>=0.5.1.dev2",
    "zeromcp>=1.6.0",
    "ida-hcli>=0.19.0",
    "httpx<1",
    "idapro",
    "packaging",
]

[project.scripts]
ida-codemode-mcp = "ida_codemode_mcp:cli"
ida-codemode-dashboard = "ida_codemode_dashboard:cli"
ida-codemode-worker = "ida_codemode.worker:main"
ida-codemode-benchmark = "ida_codemode.benchmark:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "ida-plugin.json",
    "ida_codemode_mcp.py",
    "ida_codemode_dashboard.py",
    "ida_codemode_plugin.py",
    "ida_codemode",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# IDAPython modules provide type information but are importable only inside IDA.
reportMissingModuleSource = "none"
